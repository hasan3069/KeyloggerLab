
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Keystroke Lab</title>
    <style>
        body { font-family: Arial, sans-serif; max-width: 800px;
               margin: 40px auto; padding: 0 20px; }
        textarea { width: 100%; height: 220px; padding: 10px;
                   box-sizing: border-box; }
        button { padding: 10px 16px; margin: 10px 5px 10px 0; }
        #status { margin-top: 15px; }
    </style>
</head>
<body>
    <h1>Keystroke Lab</h1>
    <p>Text entered in this test area is saved locally when capture
       is enabled. Do not enter passwords or private information.</p>

    <label for="lab-input">Test text</label>
    <textarea id="lab-input" placeholder="Type a harmless test message here..."
              disabled></textarea>

    <br>
    <button id="start">Start capture</button>
    <button id="stop" disabled>Stop capture</button>
    <p id="status">Capture stopped.</p>

    <script>
        const input = document.getElementById("lab-input");
        const status = document.getElementById("status");
        const start = document.getElementById("start");
        const stop = document.getElementById("stop");

        let capturing = false;
        let timer = null;
        let lastSaved = "";

        start.onclick = () => {
            capturing = true;
            input.disabled = false;
            start.disabled = true;
            stop.disabled = false;
            status.textContent = "Capture active. Text auto-saves.";
            input.focus();
        };

        stop.onclick = () => {
            capturing = false;
            clearTimeout(timer);
            input.disabled = true;
            start.disabled = false;
            stop.disabled = true;
            status.textContent = "Capture stopped.";
        };

        async function saveText() {
            if (!capturing || input.value === lastSaved) return;

            const text = input.value;

            try {
                const response = await fetch("/api/lab-text", {
                    method: "POST",
                    headers: {"Content-Type": "application/json"},
                    body: JSON.stringify({text: text})
                });

                if (!response.ok) throw new Error("HTTP " + response.status);

                lastSaved = text;
                status.textContent =
                    "Saved successfully at " + new Date().toLocaleTimeString();
            } catch (error) {
                status.textContent =
                    "Save failed: " + error.message +
                    ". Check that Flask is running.";
            }
        }

        input.addEventListener("input", () => {
            if (!capturing) return;
            clearTimeout(timer);
            timer = setTimeout(saveText, 500);
        });

        window.addEventListener("beforeunload", () => {
            clearTimeout(timer);
        });
    </script>
</body>
</html>
